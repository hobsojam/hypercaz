<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1A2E" />
    <title>Hypercaz</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hypercaz" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #1A1A2E; color: #fff; font-family: system-ui, sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
      h1 { margin: 0; font-size: 40px; }
      header p { margin: 4px 0 28px; color: #9AA0B8; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
      .tile { display: block; border-radius: 16px; overflow: hidden; background: #24243e; color: inherit; text-decoration: none; transition: transform 0.12s; }
      .tile:hover, .tile:focus-visible { transform: translateY(-3px); outline: 2px solid #F5C242; }
      .tile svg { display: block; width: 100%; height: auto; }
      .tile .info { padding: 12px 16px 16px; }
      .tile h2 { margin: 0; font-size: 20px; }
      .progress { margin-top: 4px; color: #9AA0B8; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Hypercaz</h1>
        <p>quick games, no ads</p>
      </header>
      <div class="grid">
        <a class="tile" href="squad/">
          <svg viewBox="0 0 220 140" aria-hidden="true">
            <rect width="220" height="140" fill="#2F7DE1" />
            <circle cx="70" cy="95" r="12" fill="#F5C242" />
            <circle cx="110" cy="80" r="12" fill="#F5C242" />
            <circle cx="150" cy="95" r="12" fill="#F5C242" />
            <circle cx="90" cy="115" r="12" fill="#F5C242" />
            <circle cx="130" cy="115" r="12" fill="#F5C242" />
            <rect x="100" y="20" width="20" height="36" rx="4" fill="#1A1A2E" opacity="0.6" />
          </svg>
          <div class="info"><h2>Squad Shooter</h2><div class="progress">New</div></div>
        </a>
        <a class="tile" href="stack/">
          <svg viewBox="0 0 220 140" aria-hidden="true">
            <defs><linearGradient id="slab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b4fa0" /><stop offset="1" stop-color="#f0a07a" /></linearGradient></defs>
            <rect width="220" height="140" fill="url(#slab)" />
            <rect x="70" y="100" width="90" height="16" rx="2" fill="#fff" opacity="0.9" />
            <rect x="78" y="82" width="84" height="16" rx="2" fill="#fff" opacity="0.75" transform="rotate(-3 120 90)" />
            <rect x="68" y="64" width="80" height="16" rx="2" fill="#fff" opacity="0.6" transform="rotate(4 108 72)" />
            <rect x="82" y="46" width="70" height="16" rx="2" fill="#fff" opacity="0.45" transform="rotate(-6 117 54)" />
          </svg>
          <div class="info"><h2>Stack</h2><div class="progress">New</div></div>
        </a>
        <a class="tile" href="sort/">
          <svg viewBox="0 0 220 140" aria-hidden="true">
            <rect width="220" height="140" fill="#16213E" />
            <g fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="3">
              <path d="M40 24 V104 a14 14 0 0 0 28 0 V24" />
              <path d="M80 24 V104 a14 14 0 0 0 28 0 V24" />
              <path d="M120 24 V104 a14 14 0 0 0 28 0 V24" />
              <path d="M160 24 V104 a14 14 0 0 0 28 0 V24" />
            </g>
            <path d="M42 70 H66 V104 a12 12 0 0 1 -24 0 Z" fill="#2F7DE1" />
            <path d="M82 52 H106 V104 a12 12 0 0 1 -24 0 Z" fill="#3CC85A" />
            <path d="M122 82 H146 V104 a12 12 0 0 1 -24 0 Z" fill="#E04040" />
            <path d="M162 60 H186 V104 a12 12 0 0 1 -24 0 Z" fill="#F5C242" />
            <rect x="42" y="70" width="24" height="18" fill="#E04040" />
            <rect x="82" y="52" width="24" height="30" fill="#F5C242" />
            <rect x="122" y="82" width="24" height="12" fill="#2F7DE1" />
            <rect x="162" y="60" width="24" height="20" fill="#3CC85A" />
          </svg>
          <div class="info"><h2>Water Sort</h2><div class="progress">New</div></div>
        </a>
        <a class="tile" href="arrows/">
          <svg viewBox="0 0 220 140" aria-hidden="true">
            <rect width="220" height="140" fill="#fff9e8" />
            <rect x="18" y="17" width="184" height="106" rx="14" fill="#ffffff" />
            <g stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M40 46h80m-14-12 14 12-14 12" stroke="#287f84" stroke-width="10" />
              <path d="M160 100V43m-12 14 12-14 12 14" stroke="#92552e" stroke-width="10" />
              <path d="M112 94H50m14-12L50 94l14 12" stroke="#336ca0" stroke-width="10" />
            </g>
          </svg>
          <div class="info"><h2>Arrow Escape</h2><div class="progress">New</div></div>
        </a>
        <a class="tile" href="merge/">
          <svg viewBox="0 0 220 140" aria-hidden="true">
            <rect width="220" height="140" fill="#2B3F6E" />
            <rect y="112" width="220" height="28" fill="#E8F0FA" opacity="0.85" />
            <rect x="34" y="62" width="152" height="68" rx="4" fill="#9A6A3A" />
            <rect x="34" y="62" width="152" height="8" fill="#B88350" />
            <path d="M34 90 H186 M34 110 H186" stroke="#6E4A26" stroke-width="3" />
            <circle cx="62" cy="52" r="14" fill="#fff" />
            <circle cx="92" cy="58" r="10" fill="#fff" />
            <circle cx="136" cy="76" r="22" fill="#fff" />
            <circle cx="136" cy="44" r="16" fill="#fff" />
            <circle cx="131" cy="41" r="2" fill="#1A1A2E" />
            <circle cx="141" cy="41" r="2" fill="#1A1A2E" />
            <path d="M136 46 l10 3 l-10 2 Z" fill="#F08A2A" />
            <path d="M121 54 Q136 62 151 54 L150 60 Q136 67 122 60 Z" fill="#D8392F" />
            <rect x="124" y="21" width="24" height="16" fill="#1A1A2E" />
            <rect x="119" y="34" width="34" height="4" rx="2" fill="#1A1A2E" />
          </svg>
          <div class="info"><h2>Snowman Merge</h2><div class="progress">New</div></div>
        </a>
      </div>
    </main>
    <script type="module" src="/games/picker/main.ts"></script>
  </body>
</html>
