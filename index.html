<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1A2E" />
    <title>Hypercaz</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hypercaz" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #1A1A2E; color: #fff; font-family: system-ui, sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
      h1 { margin: 0; font-size: 40px; }
      header p { margin: 4px 0 28px; color: #9AA0B8; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
      .tile { display: block; border-radius: 16px; overflow: hidden; background: #24243e; color: inherit; text-decoration: none; transition: transform 0.12s; }
      .tile:hover, .tile:focus-visible { transform: translateY(-3px); outline: 2px solid #F5C242; }
      .tile svg { display: block; width: 100%; height: auto; }
      .tile .info { padding: 12px 16px 16px; }
      .tile h2 { margin: 0; font-size: 20px; }
      .progress { margin-top: 4px; color: #9AA0B8; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Hypercaz</h1>
        <p>quick games, no ads</p>
      </header>
      <div class="grid">
        <a class="tile" href="squad/">
          <svg viewBox="0 0 220 140" aria-hidden="true">
            <rect width="220" height="140" fill="#2F7DE1" />
            <circle cx="70" cy="95" r="12" fill="#F5C242" />
            <circle cx="110" cy="80" r="12" fill="#F5C242" />
            <circle cx="150" cy="95" r="12" fill="#F5C242" />
            <circle cx="90" cy="115" r="12" fill="#F5C242" />
            <circle cx="130" cy="115" r="12" fill="#F5C242" />
            <rect x="100" y="20" width="20" height="36" rx="4" fill="#1A1A2E" opacity="0.6" />
          </svg>
          <div class="info"><h2>Squad Shooter</h2><div class="progress">New</div></div>
        </a>
        <a class="tile" href="stack/">
          <svg viewBox="0 0 220 140" aria-hidden="true">
            <defs><linearGradient id="slab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b4fa0" /><stop offset="1" stop-color="#f0a07a" /></linearGradient></defs>
            <rect width="220" height="140" fill="url(#slab)" />
            <rect x="70" y="100" width="90" height="16" rx="2" fill="#fff" opacity="0.9" />
            <rect x="78" y="82" width="84" height="16" rx="2" fill="#fff" opacity="0.75" transform="rotate(-3 120 90)" />
            <rect x="68" y="64" width="80" height="16" rx="2" fill="#fff" opacity="0.6" transform="rotate(4 108 72)" />
            <rect x="82" y="46" width="70" height="16" rx="2" fill="#fff" opacity="0.45" transform="rotate(-6 117 54)" />
          </svg>
          <div class="info"><h2>Stack</h2><div class="progress">New</div></div>
        </a>
      </div>
    </main>
    <script type="module" src="/games/picker/main.ts"></script>
  </body>
</html>
